name: CI

on:
  push:
    branches: [main, backend]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
